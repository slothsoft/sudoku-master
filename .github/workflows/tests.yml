name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🕸️ Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 🪅 Restore Dependencies
        run: dotnet restore SudokuMaster.sln

      - name: 🧰 Build Solution
        run: dotnet build SudokuMaster.sln --configuration Release --no-restore

      - name: 🪲 Run Tests
        run: >
          dotnet test SudokuMaster.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: 💾 Save Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
